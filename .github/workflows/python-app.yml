name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check .
    - name: Test with pytest
      run: |
        pip install pytest
        pytest

  windows-package:
    runs-on: windows-latest
    needs: build

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Cache pip downloads for Windows builds
      uses: actions/cache@v3
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install Python dependencies and PyInstaller
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pyinstaller
    - name: Install WiX Toolset 3.11
      shell: pwsh
      run: |
        $wixInstaller = "$env:TEMP\\wix311.exe"
        Invoke-WebRequest -Uri "https://wixtoolset.org/releases/v3.11.2.4516/wix311.exe" -OutFile $wixInstaller
        Start-Process -FilePath $wixInstaller -ArgumentList "/quiet" -NoNewWindow -Wait
        $wixBin = "C:\\Program Files (x86)\\WiX Toolset v3.11\\bin"
        if (!(Test-Path $wixBin)) {
          throw "WiX Toolset v3.11 not installed at $wixBin"
        }
        $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Build PyInstaller bundle
      shell: pwsh
      run: |
        pyinstaller packaging/plotinator.spec --clean --noconfirm
    - name: Harvest bundle into WiX components
      shell: pwsh
      run: |
        $bundle = Resolve-Path dist/plotinator-bundle
        $wixBin = "C:\\Program Files (x86)\\WiX Toolset v3.11\\bin"
        & "$wixBin\\heat.exe" dir $bundle `
          -nologo `
          -cg PlotinatorFiles `
          -dr INSTALLFOLDER `
          -sreg -sfrag -scom -srd `
          -out packaging/windows/plotinator-files.wxs
    - name: Build MSI with WiX 3.11 script
      shell: pwsh
      run: |
        $version = (python -c "import plotinator; print(plotinator.__version__)").Trim()
        (Get-Content packaging/windows/build-installer.bat -Raw) -replace 'set "PRODUCT_VERSION=1.0.0"', "set \"PRODUCT_VERSION=$version\"" | Set-Content packaging/windows/build-installer.bat
        Push-Location packaging/windows
        cmd /c build-installer.bat
        Pop-Location
    - name: Upload PyInstaller bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: plotinator-bundle-${{ github.ref_name }}
        path: dist/plotinator-bundle/**
    - name: Upload MSI artifact
      uses: actions/upload-artifact@v4
      with:
        name: plotinator-msi-${{ github.ref_name }}
        path: dist/Plotinator_10k.msi
